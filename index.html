<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Aquópolis · Mapa interactivo</title>
<meta name="description" content="Mapa interactivo de Aquópolis, Mar del Plata: encontrá cada tobogán, pileta, comida y servicio, y llegá caminando dentro del parque.">
<meta property="og:title" content="Aquópolis · Mapa interactivo"><meta property="og:description" content="Encontrá cada tobogán y llegá caminando dentro del parque.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sea:#0b7fb5;--sea2:#14a7d9;--ink:#0e3247;--mut:#5d7686;--card:#fff;--line:rgba(14,50,71,.12);--ext:#e23b3b;--mod:#f2a20c;--fam:#21a249;--com:#e2468f;--rel:#2a3d8f;--srv:#0ea5e9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#e9dcc0;color:var(--ink);font:600 15px/1.35 Nunito,system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:fixed;inset:0;touch-action:none;overflow:hidden;background:#efe3c8;-webkit-user-select:none;user-select:none}
#svg{width:100%;height:100%;display:block}
/* vida */
.spk{fill:#fff;opacity:0;animation:spk 3.2s ease-in-out infinite}
@keyframes spk{0%,100%{opacity:0;transform:scale(.4)}45%{opacity:.95;transform:scale(1)}60%{opacity:.2}}
.spk{transform-box:fill-box;transform-origin:center}
.wsh{fill:url(#wgrad);mix-blend-mode:screen;opacity:.55}
.swim{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(4px,-3px) rotate(6deg)}}
.cloud{fill:rgba(10,40,60,.13);filter:url(#blur);animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-900px)}to{transform:translateX(3200px)}}
.bird{fill:none;stroke:#2b3b44;stroke-width:2.4;stroke-linecap:round;animation:fly linear infinite}
@keyframes fly{from{transform:translate(-200px,0)}to{transform:translate(2700px,-220px)}}
.bird path{animation:flap .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.5)}}
.hot{fill:transparent;cursor:pointer}
.ring{fill:none;stroke-width:3.5;opacity:.95;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.95}100%{transform:scale(1.9);opacity:0}}
.ext .ring{stroke:var(--ext)}.mod .ring{stroke:var(--mod)}.fam .ring{stroke:var(--fam)}.com .ring{stroke:var(--com)}.rel .ring{stroke:var(--rel)}.srv .ring{stroke:var(--srv)}
.hl{display:none}.show .hl{display:block}
.pinb{filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
#route{fill:none;stroke:#fff;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
#route2{fill:none;stroke:var(--sea);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 18;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-20}}
#tint{position:fixed;inset:0;pointer-events:none;z-index:1;mix-blend-mode:multiply;transition:background 2s}
/* top */
.top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(180deg,rgba(255,255,255,.97) 72%,rgba(255,255,255,0));pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px}
.drop{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#21c3f0,#0b7fb5);box-shadow:0 6px 16px rgba(11,127,181,.35)}
.drop svg{width:24px;height:24px}
.ttl .k{font:800 11px/1 Nunito;letter-spacing:2.2px;text-transform:uppercase;color:var(--sea2)}
.ttl .t{font:700 25px/1.05 Fredoka,Nunito;color:var(--sea)}
.wx{margin-left:auto;text-align:right;flex:none}
.wx .c{font:700 22px/1 Fredoka;color:var(--ink);font-variant-numeric:tabular-nums}
.wx .w{font:700 12.5px Nunito;color:var(--mut);margin-top:3px;display:flex;gap:5px;justify-content:flex-end;align-items:center}
.wx .w svg{width:16px;height:16px;color:#f59e0b}
.srch{margin-top:10px;position:relative}
.box{display:flex;align-items:center;gap:9px;height:48px;padding:0 14px;border-radius:16px;background:#fff;box-shadow:0 6px 22px rgba(14,50,71,.13),inset 0 0 0 1.5px var(--line)}
.box:focus-within{box-shadow:0 6px 22px rgba(14,50,71,.15),inset 0 0 0 2px var(--sea2)}
.box svg{width:20px;height:20px;color:var(--mut);flex:none}
.box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 16px Nunito;color:var(--ink)}
.box input::placeholder{color:#8aa0ad;font-weight:600}
.sug{position:absolute;left:0;right:0;top:54px;background:#fff;border-radius:16px;box-shadow:0 14px 34px rgba(14,50,71,.2);overflow:hidden;display:none;max-height:52vh;overflow-y:auto}
.sug.on{display:block}
.sug button{display:flex;width:100%;align-items:center;gap:10px;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);font:700 15px Nunito}
.sug button small{margin-left:auto;color:var(--mut);font-weight:600;font-size:12px}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 11px Nunito;flex:none}
.chips{display:flex;gap:7px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line),0 3px 10px rgba(14,50,71,.08);font:800 13px Nunito;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%}
.chip.on{color:#fff;box-shadow:0 6px 16px rgba(14,50,71,.2)}
/* aviso */
.av{position:fixed;left:12px;right:12px;z-index:15;top:calc(env(safe-area-inset-top,0px) + 168px);height:38px;border-radius:12px;background:rgba(14,50,71,.86);color:#fff;display:flex;align-items:center;gap:9px;padding:0 12px;overflow:hidden;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font:700 13px Nunito}
.av b{flex:none;font:800 10.5px Nunito;letter-spacing:1.2px;text-transform:uppercase;background:#f59e0b;color:#3b2200;padding:3px 7px;border-radius:7px}
.av .tk{flex:1;min-width:0;white-space:nowrap;overflow:hidden;position:relative}
.av .tk span{display:inline-block;transition:transform .5s,opacity .5s}
.av em{font-style:normal;flex:none;font-size:10.5px;opacity:.6;letter-spacing:.5px}
/* zoom */
.zm{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);z-index:14;display:flex;flex-direction:column;gap:8px}
.zm button{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 6px 18px rgba(14,50,71,.18);display:grid;place-items:center}
.zm svg{width:20px;height:20px;color:var(--ink)}
/* origen */
.org{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);z-index:14;height:44px;border-radius:14px;background:#fff;box-shadow:0 6px 18px rgba(14,50,71,.18);display:flex;align-items:center;gap:8px;padding:0 12px;font:800 13px Nunito;max-width:calc(100% - 90px)}
.org svg{width:18px;height:18px;color:var(--sea);flex:none}
.org span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org.pick{background:var(--sea);color:#fff}.org.pick svg{color:#fff}
.nx{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:14;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(14,50,71,.15);font:800 11.5px Nunito;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:7px}
.nx i{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#8b5cf6)}
.nx a{color:var(--sea);text-decoration:none}
/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -12px 40px rgba(14,50,71,.25);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.25,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet.mini .desc,.sheet.mini .acts{display:none}.sheet.mini .meta{margin-top:8px}.sheet .more{display:none;width:100%;margin-top:10px;height:40px;border-radius:12px;background:#f1f5f7;font:800 13.5px Nunito;color:var(--sea)}.sheet.mini .more{display:block}
.grab{width:42px;height:5px;border-radius:3px;background:#d4dde2;margin:0 auto 10px}
.sh{display:flex;gap:12px;align-items:flex-start}
.big{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font:700 22px Fredoka;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.sh h2{font:700 22px/1.1 Fredoka;color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:6px;margin-top:5px;font:800 12px Nunito;color:var(--mut)}
.sem{display:inline-flex;gap:3px}.sem i{width:9px;height:9px;border-radius:50%;background:#dfe6ea}
.x{margin-left:auto;width:38px;height:38px;border-radius:12px;background:#f1f5f7;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.desc{margin:10px 0 0;color:#3d5664;font-weight:600}
.meta{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.meta span{background:#eef7fb;color:var(--sea);border-radius:10px;padding:6px 10px;font:800 12.5px Nunito}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.go{height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font:800 15px Nunito;background:#f1f5f7;color:var(--ink)}
.go svg{width:19px;height:19px}
.go.p{grid-column:1/-1;background:linear-gradient(135deg,#21c3f0,#0b7fb5);color:#fff;box-shadow:0 8px 20px rgba(11,127,181,.35)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);z-index:50;background:rgba(14,50,71,.92);color:#fff;padding:11px 16px;border-radius:14px;font:800 14px Nunito;opacity:0;pointer-events:none;transition:.25s;text-align:center;max-width:80%}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.lbl{font:700 22px Fredoka;fill:#fff;paint-order:stroke;stroke:rgba(14,50,71,.85);stroke-width:6px;text-anchor:middle;pointer-events:none}
@media (min-width:760px){.top{max-width:560px;border-radius:0 0 20px 0}.av{right:auto;width:536px}}
</style>
</head>

function setOrigin(o){origin=o;pickMode=false;$('org').classList.remove('pick');$('orgt').textContent='Salgo desde: '+o.n;toast('Listo: salís desde '+o.n);if(cur)open(cur,curI,false)}
$('org').onclick=()=>{pickMode=!pickMode;$('org').classList.toggle('pick',pickMode);$('orgt').textContent=pickMode?'Tocá en el mapa dónde estás':'Salgo desde: '+origin.n};
$('gs').onclick=()=>{if(!cur)return;const q=cur.p[curI];setOrigin({n:cur.n,x:q[0],y:q[1]})};
$('gr').onclick=()=>{if(!cur)return;const q=cur.p[curI];const r=route(origin,q);if(!r){toast('No encontré un camino');return}drawRoute(r)};
// ---------- ruteo sobre la grilla del plano
const GW=COST.w,GH=COST.h;const raw=atob(COST.b64);const LV=new Uint8Array(GW*GH);for(let i=0;i<LV.length;i++)LV[i]=(raw.charCodeAt(i>>2)>>((i&3)*2))&3;
const CW=[1,7,30,1e9];
function cell(x,y){return[Math.max(0,Math.min(GW-1,Math.round(x/K/2))),Math.max(0,Math.min(GH-1,Math.round(y/K/2)))]}
function snap(c){let best=null;for(let r=0;r<40&&!best;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const x=c[0]+dx,y=c[1]+dy;if(x<0||y<0||x>=GW||y>=GH)continue;if(LV[y*GW+x]===0){best=[x,y];break}}return best||c}
function route(o,q,est){const a=snap(cell(o.x,o.y)),b=snap(cell(q[0],q[1]));const N=GW*GH,g=new Float32Array(N).fill(1e12),pr=new Int32Array(N).fill(-1),cl=new Uint8Array(N);
 const s=a[1]*GW+a[0],t=b[1]*GW+b[0];g[s]=0;const hp=[[0,s]];const push=(f,i)=>{hp.push([f,i]);let k=hp.length-1;while(k){const p=(k-1)>>1;if(hp[p][0]<=hp[k][0])break;[hp[p],hp[k]]=[hp[k],hp[p]];k=p}};
 const pop=()=>{const top=hp[0],l=hp.pop();if(hp.length){hp[0]=l;let k=0;for(;;){let m=k;const L=2*k+1,R=L+1;if(L<hp.length&&hp[L][0]<hp[m][0])m=L;if(R<hp.length&&hp[R][0]<hp[m][0])m=R;if(m===k)break;[hp[m],hp[k]]=[hp[k],hp[m]];k=m}}return top};
 const hx=i=>Math.hypot(i%GW-b[0],(i/GW|0)-b[1]);let n=0;
 while(hp.length){const[,i]=pop();if(cl[i])continue;cl[i]=1;if(i===t)break;if(++n>400000)return null;const x=i%GW,y=i/GW|0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;const j=ny*GW+nx;const c=CW[LV[j]];if(c>=1e9||cl[j])continue;const ng=g[i]+c*(dx&&dy?1.414:1);if(ng<g[j]){g[j]=ng;pr[j]=i;push(ng+hx(j),j)}}}
 if(pr[t]<0&&s!==t)return null;const pts=[];for(let i=t;i>=0;i=pr[i]){pts.push([(i%GW)*2*K+K,((i/GW|0))*2*K+K]);if(i===s)break}pts.reverse();
 const sm=simplify(smooth(pts));sm.unshift([o.x,o.y]);sm.push([q[0],q[1]]);let m=0;for(let i=1;i<sm.length;i++)m+=Math.hypot(sm[i][0]-sm[i-1][0],sm[i][1]-sm[i-1][1]);return{pts:sm,m:m/K*MPP}}
function smooth(p){if(p.length<5)return p;const o=[];for(let i=0;i<p.length;i++){let sx=0,sy=0,n=0;for(let j=-3;j<=3;j++){const q=p[Math.max(0,Math.min(p.length-1,i+j))];sx+=q[0];sy+=q[1];n++}o.push([sx/n,sy/n])}return o}
function simplify(p,e=3){if(p.length<3)return p;let dm=0,ix=0;const[a,b]=[p[0],p[p.length-1]];for(let i=1;i<p.length-1;i++){const d=Math.abs((b[0]-a[0])*(a[1]-p[i][1])-(a[0]-p[i][0])*(b[1]-a[1]))/(Math.hypot(b[0]-a[0],b[1]-a[1])||1);if(d>dm){dm=d;ix=i}}return dm>e?[...simplify(p.slice(0,ix+1),e).slice(0,-1),...simplify(p.slice(ix),e)]:[a,b]}
let wa=0;function clearRoute(){$('route').setAttribute('d','');$('route2').setAttribute('d','');$('walker').innerHTML='';cancelAnimationFrame(wa)}
function drawRoute(r){const d='M'+r.pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');$('route').setAttribute('d',d);$('route2').setAttribute('d',d);
 const el=$('route');const L=el.getTotalLength();el.style.strokeDasharray=L;el.style.strokeDashoffset=L;el.getBoundingClientRect();el.style.transition='stroke-dashoffset 1.4s ease';el.style.strokeDashoffset=0;
 $('walker').innerHTML='<g class="cs" id="wk" data-x="0" data-y="0"><circle r="8" fill="#0b7fb5" stroke="#fff" stroke-width="3"/><circle r="14" fill="none" stroke="#0b7fb5" stroke-width="2.5" opacity=".5"><animate attributeName="r" values="8;18;8" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="1.6s" repeatCount="indefinite"/></circle></g>';
 const wk=$('wk'),t0=performance.now(),dur=Math.max(3500,L*4);(function f(t){const k=((t-t0)%dur)/dur;const p=el.getPointAtLength(k*L);wk.dataset.x=p.x;wk.dataset.y=p.y;wk.setAttribute('transform',`translate(${p.x} ${p.y}) scale(${1/sc})`);wa=requestAnimationFrame(f)})(t0);
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;r.pts.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});$('sheet').classList.add('mini');requestAnimationFrame(()=>{const top=250,bot=vh-$('sheet').offsetHeight-10,ah=Math.max(120,bot-top);const s=Math.min(maxS,Math.max(minS,Math.min((vw-60)/(x1-x0+40),(ah-40)/(y1-y0+40))));go(s,vw/2-(x0+x1)/2*s,top+ah/2-(y0+y1)/2*s,600)})}
// ---------- búsqueda
const q=$('q'),sug=$('sug');const nrm=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
q.addEventListener('input',()=>{const v=nrm(q.value.trim());sug.innerHTML='';if(!v){sug.classList.remove('on');return}
 const m=PL.filter(p=>nrm(p.n).includes(v)||nrm(CAT[p.c].n).includes(v)||(p.k&&p.k.toLowerCase()===v)).slice(0,10);
 m.forEach(p=>{const b=document.createElement('button');b.innerHTML=`<span class="dot" style="background:${CAT[p.c].c}">${badge(p)}</span>${p.n}<small>${CAT[p.c].n}</small>`;b.onclick=()=>{q.value='';sug.classList.remove('on');q.blur();open(p,0)};sug.appendChild(b)});
 if(!m.length)sug.innerHTML='<button disabled>No encontramos ese lugar</button>';sug.classList.add('on')});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=sug.querySelector('button:not([disabled])');if(b)b.click()}});
// ---------- avisos (ejemplo)
const AV=['Show de espuma en el Anfiteatro a las 16 h','Poseidón: fila de 10 minutos aprox.','Heladería Grido: 2x1 de 15 a 17 h','Recordá renovar el protector solar cada 2 horas','Bahía Galeón: guardavidas en el sector infantil'];let ai=0;
function nextAv(){const s=$('avt');s.style.opacity=0;s.style.transform='translateY(10px)';setTimeout(()=>{s.textContent=AV[ai++%AV.length];s.style.transform='translateY(-10px)';s.getBoundingClientRect();s.style.opacity=1;s.style.transform='none'},350)}
nextAv();setInterval(nextAv,4500);
// ---------- reloj, clima y luz del día
function hourAR(){return+new Date().toLocaleString('en-GB',{hour:'2-digit',hour12:false,timeZone:'America/Argentina/Buenos_Aires'})}
function tick(){$('clk').textContent=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Argentina/Buenos_Aires'});const h=hourAR();
 $('tint').style.background=h<7||h>=21?'rgba(40,60,140,.38)':h<9?'rgba(255,210,170,.18)':h>=19?'rgba(255,150,90,.25)':h>=17?'rgba(255,200,140,.12)':'transparent'}
tick();setInterval(tick,30000);
(async()=>{try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-38.0956&longitude=-57.6032&current=temperature_2m,weather_code&timezone=America%2FArgentina%2FBuenos_Aires');const d=await r.json();const c=d.current;const sun=c.weather_code<=1;
 $('wx').innerHTML=(sun?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="#7b93a3" stroke-width="2" stroke-linecap="round"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.6 1.5A3.3 3.3 0 0 0 7 18z"/></svg>')+Math.round(c.temperature_2m)+'° · Mar del Plata'}catch(e){}})();
// ---------- toast
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}
reset(0);setTimeout(()=>toast('Tocá cualquier juego del mapa'),900);
